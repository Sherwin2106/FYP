# Social-interaction label space used by Module 4.
#   description : text shown to the VLM as a multiple-choice option
#   anchors     : ConceptNet concepts that characterise the label (used by Module 3)
#   keywords    : extra words used to match the VLM's free-form draft to the label
# Labels can be added/edited freely; no code change is required.

activity:
